name: Build and deploy to GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    # Run once a day at 02:23 UTC (10:23 China Standard Time).
    - cron: '23 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.11.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Sync Ahrefs Domain Ratings
        if: github.event_name == 'schedule'
        run: pnpm dr:sync
        env:
          AHREFS_API_KEY: ${{ secrets.AHREFS_API_KEY }}

      - name: Build site
        run: pnpm docs:build
        env:
          SITE_URL: https://apilaile.com
          GA_MEASUREMENT_ID: G-DDTCL1CHFZ

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/.vitepress/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
